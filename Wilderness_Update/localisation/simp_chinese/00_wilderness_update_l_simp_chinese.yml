 tr_cloning_artificial_population_wilderness_tt: "每$pop_group_unit$$job_spawning_drone_plural_with_icon$使£mod_empire_size_mult£ $MOD_EMPIRE_SIZE_MULT$§G-1%§!"

 leader_trait_ruler_wilderness: "$leader_trait_ruler_hive_mind$"
 leader_trait_ruler_wilderness_desc: "$leader_trait_ruler_hive_mind_desc$"

 wilderness_update.2.desc: "在识别出一种潜在的未开智候选者后，§Y荒野§!便开始了对§Y$d_genesis_preserve$§!的基因提升流程，并为之设立了必须的空间。\n\n$cyber.7000.both$"
 wilderness_update.3.desc: "§Y荒野§!在召集了所有当地的未开智物种后，开始为它们建立一个§Y$d_genesis_preserve$§!。\n\n$cyber.7000.both$"