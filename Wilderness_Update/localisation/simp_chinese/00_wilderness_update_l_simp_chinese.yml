l_simp_chinese:
 ap_hydrocentric_wilderness: "$ap_hydrocentric$"
 ap_hydrocentric_wilderness_desc: "荒野让潮汐、藻群与共生体同时铺展到每一处海床与浅滩。经此改造的海洋星球会以远超以往的密度承接生命，为更多共生体腾出岗位。"
 ap_hydrocentric_wilderness_tt: "可以在恒星基地建设§Y冰开采站§!，并以此在§Y海洋§!星球上解锁§Y$decision_expand_planetary_sea$§!决议。\n具有§Y$trait_aquatic$§!特质的物种在§Y海洋§!星球上可以获得额外50%的加成，但生活在非§Y潮湿§!星球上的惩罚也会相应增大。\n§Y海洋星球§!上所有的£district£ ['concept_districts']§G无上限§!，并且研究$tech_climate_restoration$后，£district£ ['concept_districts']和£zone£ ['concept_district_specialization']还会提供更多岗位。"
 ap_world_shaper_wilderness: "$ap_world_shaper$"
 ap_world_shaper_wilderness_desc: "荒野并不满足于雕琢出一颗完美的花园世界，而是让其本身成为一座活着的巢城，叶冠、根系与共生体层层叠叠地承担劳作。这样的星球能容纳远超以往的生命。"
 ap_world_shaper_wilderness_tt: "$allow_gaia$\n§Y盖亚星球§!上所有的£district£ ['concept_districts']§G无上限§!，并且£district£ ['concept_districts']和£zone£ ['concept_district_specialization']会提供更多岗位。"

 civic_wilderness_subsumed_will: "疆域整合"
 civic_wilderness_subsumed_will_desc: "荒野的共生神经网络已深植于每一处生态循环，其集体意志如菌丝般渗透所有共生体。"
 civic_wilderness_subsumed_will_effects: "免除£pop£ §Y共生体强制迁移§!的£unity£ 凝聚力花费。"
 civic_wilderness_catalytic_processing: "有机物重构"
 civic_wilderness_catalytic_processing_desc: "荒野将过剩的有机物纳入生态圈的另一个循环，经由共生体分解和深度重构，转化为可构筑星舰、太空根系与外层生态节点的高级生物材料。"
 civic_wilderness_catalytic_processing_effects: "$t$—£job_forgesymbiont£ §Y$job_forgesymbiont_plural$§!替换为§Y£job_catalyst£ $job_catalyst_plural$§!\n$t$—$job_catalyst_effect_desc$"
 civic_wilderness_stargazers: "向星荒野"
 civic_wilderness_stargazers_desc: "自行星意识萌芽时它便仰望星空，荒野的意志被宇宙深空的奇迹永久吸引。为奔赴这一宏愿，生态圈暂缓局部演化，集中生命力孕育出首批可进行亚空间航行的生物舰船。"
 civic_wilderness_stargazers_effects: ""
 civic_wilderness_stargazers_negative_effects: ""
 civic_void_wilderness: "虚空荒野"
 civic_void_wilderness_desc: "荒野将冰冷虚空视作自身的延伸领土，特殊演化的太空共生体无需依托行星大气，便可在星轨、尘埃带与星云间完成完整生命周期。"
 civic_wilderness_hyperspace_specialty: "超空间感知"
 civic_wilderness_hyperspace_specialty_desc: "荒野通过分布在星系各处的共生体网络，持续感知超空间的基础频率，这种跨越维度的生物节律逐渐使舰船本能地优化航路。"
 civic_wilderness_sovereign_guardianship: "监护根系"
 civic_wilderness_sovereign_guardianship_desc: "荒野将牢牢掌控行星生态作为意识的根基，因此在漫长演化中形成了固守领土的深层本能，现在它将这种防御哲学延伸至星空。边界必须稳固，但在此范围内的共生体可保持适度自主，以维持生态的弹性与活力。"
 civic_wilderness_guided_sapience: "创世共生"
 civic_wilderness_guided_sapience_desc: "荒野划定特定生态区作为生命实验场，主动引导新物种的涌现与分化，成为生命潜能的监督者与牧养者。"
 civic_wilderness_guided_sapience_effects: "—$PLANETARY_FEATURES$§Y$d_genesis_preserve$§!\n—新殖民的行星：$PRESAPIENT$人口：§G+300§!\n—可用决议：§Y$decision_rebuild_genesis_preserve$§!\n—提升$PRESAPIENT$物种可获得$r_unity$"
 civic_astrometeorology_wilderness: "风暴感应"
 civic_astrometeorology_wilderness_desc: "为研究星际气象现象，荒野演化出可感知宇宙射电与粒子风暴的特化器官，并驱使生态向风暴区延伸。"
 civic_environmental_architects_wilderness: "系统织补"
 civic_environmental_architects_wilderness_desc: "特化共生体群体能识别生态网络中的缺陷，并以生物调控方式进行精细化的修补工作。"
 civic_wilderness_galactic_curators: "生态记忆库"
 civic_wilderness_galactic_curators_desc: "荒野通过吸纳、解析并保管星海中的标本，拓展着自身意识对宇宙的认知维度。这些被精心编织进生态网络中的藏品，已成为它理解星空、并在漫长进化中保持认知弹性的重要神经节点。"
 civic_wilderness_aerospace_adaptation: "空天适应"
 civic_wilderness_aerospace_adaptation_desc: "荒野的舰船经特化演化，完美适配跨大气层穿梭。它们既能提供近距离空中支援，也能承担行星内外的生命物流、根系铺设与共生体投送。"
 civic_wilderness_bodysnatcher: "寄生共生"
 civic_wilderness_bodysnatcher_desc: "荒野擅长以特化寄生共生体悄然潜入目标有机体，逐步操控其躯体与神经节律。随着傀儡宿主不断增多，宿主文明的思维终将被荒野同化，成为这个生态圈的全新分支。"
 civic_tooltip_memorialist_wilderness_effects: "—$job_chronicler_effect_desc$"

 chronicler: "$job_chronicler$"
 job_chronicler: "忆录体"
 job_chronicler_plural: "忆录体"
 job_chronicler_desc: "这些特化的共生体自腐解的组织、被吸收的猎物与消逝文明留下的残响中析出记忆的脉络，将其编织进永不中断的生命循环。"
 job_chronicler_effect_desc: "£job_chronicler£ $job_chronicler_plural$将$r_energy$和$r_food$（或等价物）转化为$r_unity$和$r_stability$"
 mod_job_chronicler_add: "$job_chronicler$岗位"
 mod_job_chronicler_per_pop: "每$VALUE$个人口提供§G+1§!个$job_chronicler$岗位"
 mod_job_chronicler_per_pop_short: "\n每$VALUE$£pop£ §G+1§!£job_chronicler£"
 mod_job_chronicler_add: "$job_chronicler$岗位"
 mod_job_chronicler_per_pop: "每$VALUE$个人口提供§G+1§!个$job_chronicler$岗位"
 mod_job_chronicler_per_pop_short: "\n每$VALUE$£pop£ §G+1§!£job_chronicler£"
 catalyst: "$job_catalyst$"
 job_catalyst: "催化体"
 job_catalyst_plural: "催化体"
 job_catalyst_desc: "荒野将有机质汇聚于催化体，高度特化的细胞结构将其转化为坚固的合金，以用作海军发展和高级建筑材料"
 job_catalyst_effect_desc: "£job_catalyst£ $job_catalyst_plural$将$r_food$转化为$r_alloys$"
 mod_job_catalyst_add: "$job_catalyst$岗位"
 mod_job_catalyst_per_pop: "每$VALUE$个人口提供§G+1§!个$job_catalyst$岗位"
 mod_job_catalyst_per_pop_short: "\n每$VALUE$£pop£ §G+1§!£job_catalyst£"
 mod_job_catalyst_add: "$job_catalyst$岗位"
 mod_job_catalyst_per_pop: "每$VALUE$个人口提供§G+1§!个$job_catalyst$岗位"
 mod_job_catalyst_per_pop_short: "\n每$VALUE$£pop£ §G+1§!£job_catalyst£"

 tr_purity_heightened_attributes_wilderness: "$tr_purity_heightened_attributes$"
 tr_purity_heightened_attributes_wilderness_tt: "£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$：\n$t$—£building£ §Y$building_cradle_of_rebirth$§!：§G+5%§!"
 tr_purity_heightened_attributes_wilderness_delayed: "$tr_purity_heightened_attributes_delayed$\n\n$GRANTED_BY$$UNLOCKED_BY_PURITY$"
 tr_cloning_genomic_growth_wilderness: "$tr_cloning_genomic_growth$"
 tr_cloning_genomic_growth_wilderness_delayed: "$tr_cloning_genomic_growth_delayed$\n\n$GRANTED_BY$$UNLOCKED_BY_CLONING$"
 tr_cloning_genomic_growth_wilderness_tt: "£building£ $building_cradle_of_rebirth$产生的£mod_bonus_pop_growth£ $MOD_BONUS_POP_GROWTH$：§G+0.1§!"
 tr_cloning_artificial_population_wilderness: "$tr_cloning_artificial_population$"
